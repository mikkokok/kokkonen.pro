trigger:
- main

variables:
  artifactName: 'react-app'

stages:
- stage: Build
  displayName: 'Build React App'
  jobs:
  - job: Build
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - task: Cache@2
      displayName: 'Cache npm'
      inputs:
        key: 'npm | "$(Agent.OS)" | app/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: '$(Pipeline.Workspace)/.npm'

    - script: |
        npm config set cache "$(Pipeline.Workspace)/.npm" --global
        npm ci
      workingDirectory: '$(Build.SourcesDirectory)/app'
      displayName: 'npm ci'

    - task: Npm@1
      displayName: 'npm install dependencies'
      inputs:
        workingDir: '$(Build.SourcesDirectory)/app'
        verbose: true
    
    - task: Npm@1
      displayName: 'npm install'
      inputs:
        command: 'custom'
        customCommand: 'run build'
        workingDir: '$(Build.SourcesDirectory)/app'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish React App'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/app/dist'
        ArtifactName: '$(artifactName)'

- stage: Deploy
  displayName: 'Deploy to local'
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: 'Deploy on Local Ubuntu Agent'
    pool:
      name: 'linux'
    steps:
    - task: DownloadBuildArtifacts@0
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: '$(artifactName)'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'mikkokok'
        KeyVaultName: 'kv-kokkonenpro'
        SecretsFilter: '*'
        RunAsPreJob: true
        
    - script: |
        echo $(Build.SourcesDirectory)
        ls -al $(Build.SourcesDirectory)
        ls -al $(Build.SourcesDirectory)/pipeline
        chmod +x $(Build.SourcesDirectory)/pipeline/deploy.sh
        echo "Deploying files to remote Windows server..."
        cd $(Build.SourcesDirectory)
        ls -al
        ls -al pipeline
        ./pipeline/deploy.sh "$(System.ArtifactsDirectory)/$(artifactName)/*" "$(webServerUser)" "$(webServerPassword)" "$(webServerIp)"
      displayName: 'Copy files to remote Windows server using deploy.sh'
